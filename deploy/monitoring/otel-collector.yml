# HR360 — OpenTelemetry Collector ("monitoring" profili).
# Servisler (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317) izleri buraya
# gonderir; collector KVKK maskelemesini IKINCI KEZ uygular ve Tempo'ya iletir.
#
# Birinci savunma hatti servislerin icindeki PiiMaskingProcessor'dur
# (apps/services/*/Observability/Telemetry.cs). Bu dosyadaki kurallar, eski/yanlis
# yapilandirilmis bir istemciden gelebilecek kisisel veriyi de Tempo'ya yazmadan keser:
#   - sorgu dizeleri, istek/yanit basliklari, kullanici kimligi, istemci IP'si, user-agent
#     ve SQL parametreleri silinir;
#   - kalan degerlerdeki GUID, e-posta, TCKN benzeri 11 haneli sayi, IBAN ve JWT/Bearer
#     jetonlari maskelenir (span ozellikleri, kaynak ozellikleri ve span olaylari);
#   - istisna olaylarindaki yigin izi (stacktrace) silinir.
# Collector disariya acilmaz (yalnizca hr360-net).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 40

  # 1) Yasakli ozellikleri tamamen sil.
  attributes/kvkk:
    actions:
      - { key: url.query, action: delete }
      - { key: http.query, action: delete }
      - { key: http.target, action: delete }
      - { key: user_agent.original, action: delete }
      - { key: http.user_agent, action: delete }
      - { key: client.address, action: delete }
      - { key: client.port, action: delete }
      - { key: http.client_ip, action: delete }
      - { key: messaging.message.body, action: delete }
      - { key: messaging.kafka.message.key, action: delete }
      - { key: db.connection_string, action: delete }
      - { pattern: '^http\.request\.header\..*', action: delete }
      - { pattern: '^http\.response\.header\..*', action: delete }
      - { pattern: '^enduser\..*', action: delete }
      - { pattern: '^db\.query\.parameter\..*', action: delete }
      - { pattern: '^(user|users)\.(id|email|name)$', action: delete }

  # 2) Kalan degerlerde kisisel veri kaliplarini maskele (span ozellikleri).
  redaction/kvkk:
    allow_all_keys: true
    blocked_values:
      - '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'   # GUID
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'                                  # e-posta
      - '\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]){11,30}\b'                                     # IBAN
      - '\b[0-9]{10,}\b'                                                                  # TCKN / uzun sayi
      - 'eyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]*'                          # JWT
    summary: silent

  # 3) Span olaylari (istisnalar) ve URL'ler: redaction islemcisi bunlara ulasmaz.
  transform/kvkk:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "\\?.*$$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$$", "")
          - replace_pattern(name, "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "{guid}")
          - replace_pattern(status.message, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "{email}")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.stacktrace")
          - replace_pattern(attributes["exception.message"], "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "{guid}")
          - replace_pattern(attributes["exception.message"], "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "{email}")
          - replace_pattern(attributes["exception.message"], "\\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]){11,30}\\b", "{iban}")
          - replace_pattern(attributes["exception.message"], "\\b[0-9]{10,}\\b", "{number}")
          - replace_pattern(attributes["exception.message"], "\\(([^)]*)\\)=\\(([^)]*)\\)", "($$1)=(?)")

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/kvkk, transform/kvkk, redaction/kvkk, batch]
      exporters: [otlp/tempo]
