# Docker soketi uzerinden hr360 projesindeki tum konteynerlerin stdout/stderr
# loglarini toplar. "service" etiketi compose servis adidir.
server:
  http_listen_port: 9080
  log_level: warn
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=hr360"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
    pipeline_stages:
      # Ilk acilista eski konteyner loglari Loki'nin kabul penceresinin disinda
      # kalir; bunlari gondermeye calismak yerine dusur.
      - drop:
          older_than: 24h
          drop_counter_reason: too_old
      # .NET servisleri varsayilan olarak tek satir JSON yazar (HR360_LOG_FORMAT=json): seviye LogLevel,
      # istek kimligi Scopes icinde (Loki'de: {service="..."} | json | line_format ... ya da |= "<kimlik>").
      # Duz metin (HR360_LOG_FORMAT=text) "fail:" / "warn:" / "info:" ile baslar.
      - json:
          expressions:
            jlvl: LogLevel
      - regex:
          expression: '^(?P<lvl>fail|crit|warn|info|dbug|trce):'
      - template:
          source: level
          template: '{{ if or (eq .lvl "fail") (eq .jlvl "Error") }}error{{ else if or (eq .lvl "crit") (eq .jlvl "Critical") }}critical{{ else if or (eq .lvl "warn") (eq .jlvl "Warning") }}warning{{ else if or .lvl .jlvl }}info{{ end }}'
      - labels:
          level:
