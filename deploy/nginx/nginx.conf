events {
    worker_connections 1024;
}

http {
    # Tek sunucu kurulumunda tum servisler ayni Docker network'unde,
    # servis adiyla birbirini bulur (Docker'in dahili DNS'i).
    #
    # NOT: Onceden adresler yalnizca nginx acilisinda cozuluyordu. Bir servis
    # konteyneri yeniden baslayip yeni IP aldiginda gateway, kendisi yeniden
    # baslatilana kadar o servise 404/502 donuyordu (dagitim sonrasi kesinti).
    # "resolve" ile Docker DNS'i (127.0.0.11) 10 sn'de bir yeniden sorulur.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Istek siniri (IP basina). Ozel ag adresleri (10/8, 172.16/12, 192.168/16, yerel)
    # muaf: kurum ici NAT'ta herkes ayni adresle gelir, Docker agi icindeki araclar
    # (yuk testi, servisler) etkilenmez. Gateway'in onunde bir dengeleyici varsa
    # gercek istemci adresi icin real_ip ayari yapilmalidir.
    geo $hr360_private_client {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
    }
    # Bos anahtar = sinir uygulanmaz (geo degerleri degisken alamadigi icin map ile).
    map $hr360_private_client $hr360_limit_key {
        0 $binary_remote_addr;
        1 "";
    }
    limit_req_zone $hr360_limit_key zone=hr360_api:10m rate=50r/s;
    limit_req_zone $hr360_limit_key zone=hr360_login:10m rate=10r/s;
    # Oturumsuz (herkese acik) uclar icin daha dusuk sinir: etik hatti, kariyer sayfasi/basvuru,
    # belge dogrulama, takvim (ICS) beslemesi, sirket kaydi/marka, e-postadan onay. IP basina
    # saniyede 2 istek (20'lik ani yuk payi). Ozel ag adresleri yine muaf (bkz. $hr360_limit_key).
    limit_req_zone $hr360_limit_key zone=hr360_public:10m rate=2r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Gateway'in onunde TLS'i sonlandiran bir dengeleyici varsa (scripts/tls.sh
    # external) asil sema onun X-Forwarded-Proto basligindadir; yoksa baglantinin
    # kendi semasi kullanilir.
    map $http_x_forwarded_proto $hr360_forwarded_proto {
        default $scheme;
        https   https;
    }
    upstream keycloak_backend    { zone keycloak_backend 64k; server keycloak:8080 resolve; }
    upstream ml_inference_backend { zone ml_inference_backend 64k; server ml-inference:8000 resolve; }
    upstream minio_backend       { zone minio_backend 64k; server minio:9000 resolve; }
    upstream organization_backend { zone organization_backend 64k; server organization-service:8080 resolve; }
    upstream employee_backend    { zone employee_backend 64k; server employee-service:8080 resolve; }
    upstream workflow_backend    { zone workflow_backend 64k; server workflow-service:8080 resolve; }
    upstream recruitment_backend { zone recruitment_backend 64k; server recruitment-service:8080 resolve; }
    upstream onboarding_backend  { zone onboarding_backend 64k; server onboarding-service:8080 resolve; }
    upstream learning_backend    { zone learning_backend 64k; server learning-service:8080 resolve; }
    upstream notification_backend { zone notification_backend 64k; server notification-service:8080 resolve; }
    upstream leave_backend       { zone leave_backend 64k; server leave-service:8080 resolve; }
    upstream compensation_backend { zone compensation_backend 64k; server compensation-service:8080 resolve; }
    upstream expense_backend     { zone expense_backend 64k; server expense-service:8080 resolve; }
    upstream timeshift_backend   { zone timeshift_backend 64k; server timeshift-service:8080 resolve; }
    upstream performance_backend { zone performance_backend 64k; server performance-service:8080 resolve; }
    upstream tenant_backend      { zone tenant_backend 64k; server tenant-service:8080 resolve; }
    upstream engagement_backend  { zone engagement_backend 64k; server engagement-service:8080 resolve; }
    upstream governance_backend  { zone governance_backend 64k; server governance-service:8080 resolve; }
    upstream web_frontend        { zone web_frontend 64k; server web:8080 resolve; }

    server {
        # Logo yuklemesi 2 MB'a kadar izinli; nginx varsayilani (1 MB) gecerli
        # dosyalari 413 HTML sayfasiyla reddediyordu.
        client_max_body_size 3m;
        server_tokens off;
        listen 80;
        server_name _;
        # HTTPS (istege bagli): scripts/tls.sh enable ile uretilen listen/yonlendirme.
        # Dosya yoksa (varsayilan) yalnizca HTTP.
        include /etc/nginx/tls/*.conf;

        add_header X-Content-Type-Options "nosniff" always;
        # Her istegin kimligi: denetim kaydinda (audit_log.CorrelationId) da bu deger var.
        add_header X-Correlation-Id $request_id always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;

        # Genel istek siniri; giris uclarinda daha siki (bkz. /auth/).
        limit_req zone=hr360_api burst=200 nodelay;

        # Let's Encrypt HTTP-01 dogrulamasi (scripts/tls.sh enable --letsencrypt).
        # certbot jeton dosyalarini deploy/nginx/acme'ye yazar; HTTPS yonlendirmesi
        # bu yolu atlar (bkz. tls.sh'in urettigi redirect.conf).
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location /gateway/health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"hr360-gateway"}';
        }

        # Keycloak, --http-relative-path=/auth ile calisiyor; bu yuzden
        # yol degistirmeden (rewrite yapmadan) birebir yonlendiriyoruz.
        # Keycloak yonetim konsolu + master realm (yonetici girisi ve yonetim API'si).
        # Erisim kurali scripts/keycloak-admin-access.sh ile uretilen dosyadan gelir:
        # dosya yoksa (varsayilan) acik; "ip" modunda yalnizca izinli IP'ler; "port"
        # modunda burada tamamen kapali (panel ayri porttan, bkz. alttaki server).
        # Bkz. docs/runbooks/keycloak-yonetim-paneli-erisimi.md
        location ~ ^/auth/(admin|realms/master)(/|$) {
            include /etc/nginx/keycloak-admin/main-*.conf;
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Istemcinin gonderdigi X-Forwarded-For Keycloak'a iletilmez (IP taklidi).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Uygulama ya da Keycloak ayakta degilken (guncelleme, yeniden baslatma) ham nginx
        # 502 sayfasi yerine JS'siz statik bakim sayfasi; kendiliginden yeniden dener.
        # Yalnizca sayfa/giris yollarinda: /api yanitlari JSON istemcilerine aynen gider.
        location = /_hr360/bakim.html {
            internal;
            alias /etc/nginx/errors/bakim.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "20" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location /auth/ {
            error_page 502 503 504 /_hr360/bakim.html;
            # Parola deneme / jeton istekleri icin siki sinir (Keycloak'in kendi kaba kuvvet
            # korumasina ek olarak, IP basina).
            limit_req zone=hr360_login burst=30 nodelay;
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            # Istemcinin gonderdigi X-Forwarded-Host olduğu gibi Keycloak'a
            # iletiliyordu; ezilir (Keycloak'in genel adresi zaten sabit).
            proxy_set_header X-Forwarded-Host $host;
        }

        # Servisler arasi uclar (/api/<servis>/internal/...) yalnizca konteyner
        # aginda kullanilir; ayrica INTERNAL_SERVICE_TOKEN ister.
        location ~ ^/api/[^/]+/internal/ {
            return 404;
        }

        # Prometheus metrikleri yalnizca ic agdan kazinir; disariya acilmaz.
        # Performans ML uclari yalnizca performance-service icin (ic ag); jeton denetimi
        # yoktur, gateway'den kapatilir.
        location ^~ /ml/performance/ {
            return 404;
        }

        location = /ml/metrics {
            return 404;
        }

        # KVKK m.11/1-g: kişi bazlı risk tahmini yalnızca governance üzerinden yapılır
        # (/api/governance/privacy/analysis/attrition/<çalışan>): itiraz denetlenir ve
        # her hesaplama erişim kaydına yazılır. Doğrudan model uçları dışarıya kapalı.
        location = /ml/predict {
            return 404;
        }

        location = /ml/explain {
            return 404;
        }

        # ML dalgası 2: yalnızca servisler arası kullanılan uçlar (bordro/puantaj denetimi, ücret adaleti,
        # izin tahmini, anket konuları, beceri haritası, anlamsal arama dizini). Yetki ve denetim kaydı
        # sahibi serviste (compensation/timeshift/engagement/governance); dışarıdan doğrudan erişim kapalı.
        location ~ ^/ml/(payroll|compensation|forecast|text|semantic)/ {
            return 404;
        }

        location = /ml/skills/graph {
            return 404;
        }

        # Grafana (scripts/monitoring.sh enable). Grafana kendi girisini ister.
        # Izleme profili cogu kurulumda kapali: ad istek aninda cozulur (degiskenli proxy_pass).
        # Onceden "upstream ... resolve" arka planda 30 sn'de bir cozup grafana yokken her seferinde
        # hata gunlugu yaziyordu (haftada ~20 bin satir). Kapaliyken /grafana/ yine 502 doner.
        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            # Grafana Live (websocket)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }

        # CV ayristirma ML servisinde 5 MB'a kadar dosya kabul eder; genel 3 MB siniri bu uca
        # uygulanirsa 5 MB'a yakin dosyalar nginx'te 413 ile kesiliyordu.
        location = /ml/ai/cv/parse {
            client_max_body_size 6m;
            proxy_pass http://ml_inference_backend/ai/cv/parse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
        }

        location /ml/ {
            proxy_pass http://ml_inference_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
        }

        # Android uygulaması (scripts/android-build.sh deploy/downloads/HR360.apk'ye kopyalar). add_header
        # kullanılmaz: sunucu düzeyindeki güvenlik başlıkları (HSTS dahil) bu konumda da geçerli kalsın.
        location = /indir/HR360.apk {
            limit_except GET HEAD {
                deny all;
            }
            alias /usr/share/nginx/downloads/HR360.apk;
            types { }
            default_type application/vnd.android.package-archive;
        }

        location /logos/ {
            limit_except GET HEAD {
                deny all;
            }
            rewrite ^/logos/(.*) /tenant-logos/$1 break;
            proxy_pass http://minio_backend;
            proxy_set_header Host $host;
            # GUVENLIK: Logolar uygulamanin kendi alan adindan sunuluyor. Betik
            # iceren bir dosya (onceden SVG kabul ediliyordu) burada calisamasin:
            # sandbox CSP + nosniff; eski .svg dosyalari yalnizca indirilir.
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            add_header X-Content-Type-Options "nosniff" always;
            location ~* \.svg$ {
                limit_except GET HEAD {
                    deny all;
                }
                rewrite ^/logos/(.*) /tenant-logos/$1 break;
                proxy_pass http://minio_backend;
                proxy_set_header Host $host;
                add_header Content-Security-Policy "default-src 'none'; sandbox" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Disposition "attachment" always;
            }
        }

        # Birlesik API belgesi (/panel/api-belgeleri): servislerin OpenAPI tanimlari,
        # yalnizca oturum acmis kullanicilara. Jeton governance /api/me/language (salt okuma,
        # her rol, calisan kaydi gerekmez) ile dogrulanir.
        location = /_api_docs_auth {
            internal;
            proxy_pass http://governance_backend/api/me/language;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api-docs/specs/(organization|employee|workflow|recruitment|onboarding|learning|notification|leave|compensation|expense|timeshift|performance|engagement|governance|tenant)\.json$ {
            auth_request /_api_docs_auth;
            set $api_docs_service $1;
            proxy_pass http://${api_docs_service}_backend/swagger/v1/swagger.json;
            proxy_set_header Host $host;
            add_header Cache-Control "private, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/organization/ {
            rewrite ^/api/organization/(.*) /api/$1 break;
            proxy_pass http://organization_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/employee/ {
            rewrite ^/api/employee/(.*) /api/$1 break;
            proxy_pass http://employee_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/workflow/ {
            rewrite ^/api/workflow/(.*) /api/$1 break;
            proxy_pass http://workflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Kariyer sayfasi ve aday oz-hizmeti (oturumsuz, Y16): dusuk sinir (servis ayrica IP basina sinirlar).
        location ^~ /api/recruitment/public/ {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/recruitment/(.*) /api/$1 break;
            proxy_pass http://recruitment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # E-postadaki "karar ver" baglantisi (oturumsuz, tek kullanimlik jeton): dusuk sinir.
        location ^~ /api/workflow/workflows/email-action {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/workflow/(.*) /api/$1 break;
            proxy_pass http://workflow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/recruitment/ {
            rewrite ^/api/recruitment/(.*) /api/$1 break;
            proxy_pass http://recruitment_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/onboarding/ {
            rewrite ^/api/onboarding/(.*) /api/$1 break;
            proxy_pass http://onboarding_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # SCORM 1.2 paket yuklemesi (Y20): zip en fazla 50 MB (genel sinir 3 MB).
        location = /api/learning/scorm/packages {
            client_max_body_size 51m;
            rewrite ^/api/learning/(.*) /api/$1 break;
            proxy_pass http://learning_backend;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/learning/ {
            rewrite ^/api/learning/(.*) /api/$1 break;
            proxy_pass http://learning_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/notification/ {
            rewrite ^/api/notification/(.*) /api/$1 break;
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/leave/ {
            rewrite ^/api/leave/(.*) /api/$1 break;
            proxy_pass http://leave_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/compensation/ {
            rewrite ^/api/compensation/(.*) /api/$1 break;
            proxy_pass http://compensation_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/expense/ {
            rewrite ^/api/expense/(.*) /api/$1 break;
            proxy_pass http://expense_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Giris-cikis cihaz uclari (oturumsuz, X-Device-Key): kart/PIN terminali ve kiosk tableti (dalga 9,
        # madde 68). Dusuk sinir; servis ayrica cihaz anahtari basina dakikada 120 istekle sinirlar.
        location ~ ^/api/timeshift/time-clock/(terminal|kiosk)/ {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/timeshift/(.*) /api/$1 break;
            proxy_pass http://timeshift_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/timeshift/ {
            rewrite ^/api/timeshift/(.*) /api/$1 break;
            proxy_pass http://timeshift_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/performance/ {
            rewrite ^/api/performance/(.*) /api/$1 break;
            proxy_pass http://performance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/engagement/ {
            rewrite ^/api/engagement/(.*) /api/$1 break;
            proxy_pass http://engagement_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Canli olay radari: Server-Sent Events. Tamponlama kapali, baglanti uzun
        # omurlu (sunucu 15 sn'de bir "ping" yollar).
        location /api/governance/events/stream {
            rewrite ^/api/governance/(.*) /api/$1 break;
            proxy_pass http://governance_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Y15 etik/ihbar hattı (herkese açık, oturumsuz): ihbarcının anonimliği için bu yolda
        # erişim kaydı tutulmaz ve istemci IP'si servise iletilmez (X-Real-IP/X-Forwarded-For
        # boş gönderilir). Diğer ayarlar /api/governance/ bloğuyla aynıdır.
        location ^~ /api/governance/ethics/public/ {
            access_log off;
            # Oturumsuz form: genel sinira ek olarak dusuk sinir (guvenlik dalgasi 2B).
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/governance/(.*) /api/$1 break;
            proxy_pass http://governance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Belge dogrulama (QR, oturumsuz): dusuk sinir (kod tahmini denemelerine karsi).
        location ^~ /api/governance/documents/verify/ {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/governance/(.*) /api/$1 break;
            proxy_pass http://governance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Takvim (ICS) beslemesi (oturumsuz, URL jetonlu): dusuk sinir.
        location ~ ^/api/governance/calendar/ics/ {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/governance/(.*) /api/$1 break;
            proxy_pass http://governance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/governance/ {
            rewrite ^/api/governance/(.*) /api/$1 break;
            proxy_pass http://governance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Sirket kaydi, marka ve ozel alan adi cozumleme (oturumsuz): dusuk sinir.
        location ~ ^/api/tenant/(public|registration)(/|$) {
            limit_req zone=hr360_api burst=200 nodelay;
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/api/tenant/(.*) /api/$1 break;
            proxy_pass http://tenant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        # Arama motorlari: icerik Platform > Sistem ayarlari'ndaki "Arama motorlarinda gorunur"
        # anahtarina gore tenant-service'te uretilir (varsayilan kapali: Disallow: /).
        location ~ ^/(robots\.txt|sitemap\.xml)$ {
            limit_req zone=hr360_public burst=20 nodelay;
            rewrite ^/(.*)$ /api/public/$1 break;
            proxy_pass http://tenant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }
        location /api/tenant/ {
            rewrite ^/api/tenant/(.*) /api/$1 break;
            proxy_pass http://tenant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Correlation-Id $request_id;
        }

        location / {
            error_page 502 503 504 /_hr360/bakim.html;
            proxy_pass http://web_frontend;
            # Uygulama kapsayicisi CSP dahil kendi guvenlik basliklarini gonderir; gateway'in
            # ayni basliklari ikinci kez eklenmesin diye upstream kopyalari gizlenir.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Permissions-Policy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
        }
    }

    # Keycloak yonetim konsolu icin ayri giris noktasi ("port" modu). Firewall yol
    # bazinda kural yazamadigi icin panel ayri bir portta yayinlanir; o port
    # firewall (ufw/firewalld/guvenlik grubu) ile yalnizca yonetim IP'lerine acilir.
    # Konteyner portu 8090; disariya yayinlanan adres/port .env'deki
    # KEYCLOAK_ADMIN_BIND / KEYCLOAK_ADMIN_PORT ile (varsayilan yalnizca 127.0.0.1).
    server {
        listen 8090;
        server_name _;
        server_tokens off;
        include /etc/nginx/keycloak-admin/port-*.conf;

        location = / {
            return 302 /auth/admin/;
        }

        location /auth/ {
            proxy_pass http://keycloak_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $hr360_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location / {
            return 404;
        }
    }

    # "port" modunda ana adres HTTPS ise scripts/keycloak-admin-access.sh aynı sertifikayla TLS'li bir
    # yönetim sunucusu (konteyner portu 8443) üretir; dışarıdaki yönetim portu buna yönlenir ve yönetici
    # parolası ağda şifresiz gitmez. Dosya yoksa (HTTPS kapalı / diğer modlar) etkisi yoktur.
    include /etc/nginx/keycloak-admin/server-*.conf;
}
