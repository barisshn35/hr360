# HR360 giris temasi: Keycloak'in "keycloak" temasini (sayfa sablonlari,
# PatternFly) aynen kullanir, uzerine HR360'in "Obsidyen Zumrut" gorunumunu
# giydirir. CSS ve metin degisir; js/hr360.js "Parolami unuttum" baglantisini HR360'in
# sureli link akisina (/parola-sifirla) yonlendirir. Giris ve OTP Keycloak'in kendi
# sablonlariyla calisir; hata sayfasi (error.ftl) HR360 hata ekranlari gorunumundedir.
parent=keycloak
import=common/keycloak
styles=css/login.css css/hr360.css
scripts=js/hr360.js
locales=tr,en
