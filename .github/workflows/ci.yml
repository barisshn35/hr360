# HR360 surekli entegrasyon: her push / PR'da arayuz, .NET servisleri,
# ML servisi, dagitim dosyalari ve guvenlik taramasi (Trivy, npm audit, NuGet) dogrulanir. main'e push'ta ek olarak Docker
# imajlari derlenir, taranir ve hazir imaj olarak yayinlanir: ghcr.io/<depo>/<servis>:sha-<commit>, cosign ile
# anahtarsiz imzali (bu is akisinin GitHub kimligi) + SBOM tasdiki. Sunucu guncellemede bunlari indirir ve imzayi
# dogrular (scripts/lib/images.sh); imaj adlari docker-compose.yml'deki servis adlaridir.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Arayuz (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tip denetimi
        run: npm run lint
      # React hook kurallari, erisilebilirlik (jsx-a11y), olasi hatalar; kurallar .oxlintrc.json'da.
      - name: Kod denetimi (Oxlint)
        run: npm run lint:js -- --format github
      # Kapsam alt siniri (package.json test:coverage): olculen degerin altina dusmesin; testler arttikca yukseltilir.
      - name: Birim testleri ve kapsam (Vitest)
        run: npm run test:coverage
      - name: Kapsam ozeti
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e 'const t=require("./coverage/coverage-summary.json").total;
            console.log("### Arayuz test kapsami\n\n| Olcu | Oran |\n|---|---|\n"+["lines","statements","branches","functions"].map(k=>"| "+k+" | %"+t[k].pct+" ("+t[k].covered+"/"+t[k].total+") |").join("\n"))' >> "$GITHUB_STEP_SUMMARY"
      - name: Çeviri sözlüğü (eksik ya da yer tutucusu uyumsuz anahtar)
        run: npm run i18n:check
      - name: Tema kontrastı (WCAG 2.1 AA, açık ve koyu tema)
        run: npm run contrast:check
      - name: Uretim derlemesi
        env:
          VITE_KEYCLOAK_URL: /auth
          VITE_KEYCLOAK_REALM: hr360
          VITE_KEYCLOAK_CLIENT_ID: hr360-web
          VITE_API_BASE: ""
        run: npx vite build
      # Ilk acilista yuklenen kod ve tek parca icin gzip butcesi (scripts/bundle-budget.mjs).
      - name: Paket boyutu (butce)
        run: node scripts/bundle-budget.mjs --summary "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: .NET — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - compensation-service
          - employee-service
          - engagement-service
          - expense-service
          - governance-service
          - learning-service
          - leave-service
          - notification-service
          - onboarding-service
          - organization-service
          - performance-service
          - recruitment-service
          - tenant-service
          - timeshift-service
          - workflow-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.service }}-${{ hashFiles(format('apps/services/{0}/*.csproj', matrix.service)) }}
          restore-keys: nuget-
      - name: Derle
        working-directory: apps/services/${{ matrix.service }}
        run: dotnet build -c Release -nologo
      - name: Biçim (.editorconfig; düzeltmek için "dotnet format whitespace")
        working-directory: apps/services/${{ matrix.service }}
        run: dotnet format whitespace *.csproj --verify-no-changes -v q

  dotnet-tests:
    name: .NET birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-tests-${{ hashFiles('tests/dotnet/**/*.csproj', 'apps/services/governance-service/*.csproj', 'apps/services/engagement-service/*.csproj') }}
          restore-keys: nuget-
      - name: Biçim (test projeleri)
        run: for p in tests/dotnet/*/*.csproj; do dotnet format whitespace "$p" --verify-no-changes -v q; done
      # Kapsam: dotnet-coverage (test projelerine paket eklemeden); servis basina ozet CI sayfasinda.
      - name: xUnit ve kapsam
        env:
          DOTNET_COVERAGE_NOLOGO: "1"
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet tool install -g dotnet-coverage --version 18.12.0 >/dev/null
          mkdir -p coverage
          for p in tests/dotnet/*/; do
            n="$(basename "$p")"
            dotnet-coverage collect -f cobertura -o "coverage/$n.xml" "dotnet test $p --nologo --logger trx;LogFileName=results.trx"
          done
      - name: Kapsam ozeti
        if: always()
        run: python3 tests/support/coverage_summary.py ".NET test kapsami" coverage/*.xml >> "$GITHUB_STEP_SUMMARY"

  ml:
    name: ML servisi (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/ml-inference/requirements*.txt
      - name: Bagimliliklar
        # Testler yalnizca ai_tools router'ini yukler; mlflow/shap gibi agir
        # paketler gerekmez. Surumler requirements dosyalarindan alinir.
        run: |
          grep -E '^(fastapi|starlette|pydantic|httpx|numpy|scikit-learn|prometheus-fastapi-instrumentator|ortools)==' requirements.txt > ci-req.txt
          cat requirements-ai.txt requirements-dev.txt >> ci-req.txt
          pip install -r ci-req.txt
      - name: Sozdizimi
        run: python -m compileall -q .
      - name: Testler ve kapsam
        run: |
          python -m pytest -q --cov=. --cov-report= tests
          { echo "### ML servisi test kapsami"; echo; python -m coverage report --format=markdown --omit='tests/*' | tail -1; } >> "$GITHUB_STEP_SUMMARY"

  deploy-config:
    name: Dagitim dosyalari
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ornek .env
        # .env.example'dan; orada olmayan degiskenler (sir/parola) sahte degerle eklenir.
        run: |
          cp .env.example .env
          # HR360_MOD_* sayıdır (compose scale) ve tanımsızken modül açıktır: sahte değer verilmez.
          grep -oE '\$\{[A-Z0-9_]+' docker-compose.yml | cut -c3- | sort -u | grep -v '^HR360_MOD_' | while read -r v; do
            grep -q "^$v=" .env || echo "$v=ci" >> .env
          done
      - name: docker compose config (tum profiller)
        run: docker compose --profile monitoring --profile letsencrypt --profile mailer config -q
      - name: Hazir imaj listesi compose ile esit (images isi; scripts/lib/images.sh)
        run: |
          docker compose --profile monitoring --profile letsencrypt --profile mailer config --format json \
            | python3 -c 'import json,sys; print("\n".join(sorted(n for n,s in json.load(sys.stdin)["services"].items() if "build" in s)))' > /tmp/compose-builds
          grep -oE '^          - \{ name: [a-z0-9-]+' .github/workflows/ci.yml | awk '{print $NF}' | LC_ALL=C sort > /tmp/ci-images
          diff /tmp/compose-builds /tmp/ci-images || { echo "docker-compose.yml'de derlenen servisler ile ci.yml images matrisi farkli"; exit 1; }
      - name: nginx -t
        run: docker run --rm --network none -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Prometheus kurallari
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" prom/prometheus:v2.55.1 check rules /m/alerts.yml
          # Esik birim testleri (outbox, yedek, sertifika, 5xx)
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" -w /m prom/prometheus:v2.55.1 test rules /m/alerts.test.yml
          # prometheus.yml rule_files yolunu konteyner icinden cozer
          docker run --rm --entrypoint sh -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v2.55.1 -c 'promtool check config /etc/prometheus/prometheus.yml'
      - name: Alertmanager yapilandirmasi (tum kanallar acik)
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e ALERT_EMAIL_TO=a@example.com,b+ops@example.com -e ALERT_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T/B/X \
            -e "ALERT_TEAMS_WEBHOOK_URL=https://example.logic.azure.com/workflows/x?api-version=1&sig=a%2Fb" -e "INTERNAL_SERVICE_TOKEN=t'k" \
            -v "$PWD/deploy/monitoring/alertmanager-entrypoint.sh:/e.sh:ro" -v "$PWD/deploy/monitoring/alertmanager.tmpl:/etc/alertmanager/templates/hr360.tmpl:ro" \
            prom/alertmanager:v0.28.1 /e.sh check
      - name: Grafana panoları JSON
        run: for f in deploy/monitoring/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: blackbox-exporter ve postgres-exporter yapılandırması
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/blackbox.yml:/b.yml:ro" prom/blackbox-exporter:v0.25.0 --config.file=/b.yml --config.check
          python3 -c "import yaml,sys; q=yaml.safe_load(open('deploy/monitoring/postgres-exporter-queries.yml')); assert all('query' in v and 'metrics' in v for v in q.values())"
      - name: Surum numaralari VERSION ile ayni (web, mobil)
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          for p in apps/web/package.json apps/mobile/package.json; do
            [ "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$p")" = "$v" ] || { echo "::error::$p surumu VERSION ($v) ile farkli"; exit 1; }
          done
      - name: Python denetimi (ruff; ruff.toml)
        run: pipx run ruff==0.17.1 check .
      - name: Ortak .NET kaynaklarinin servis kopyalari esit
        run: scripts/sync-shared.sh --check
      - name: Kabuk betikleri (bash -n + shellcheck)
        run: |
          for f in install.sh scripts/*.sh scripts/lib/*.sh tests/install/*.sh; do bash -n "$f"; done
          shellcheck -x -S error install.sh scripts/*.sh scripts/lib/*.sh tests/install/*.sh
      - name: Kurulum otomasyonu (HTTPS, DNS, SMTP; sahte docker/curl ile)
        run: tests/install/test_install.sh
      - name: Yedek ve guncelleme (sifreleme, dis depo, geri yukleme testi, otomatik geri donus)
        run: tests/install/test_backup_update.sh
      - name: Isteğe bağlı modüller (scripts/modules.sh, compose scale)
        run: tests/install/test_modules.sh
      - name: Sirket kipi (scripts/tenancy.sh; sahte docker)
        run: tests/install/test_tenancy.sh
      - name: Anlik geri donus (PITR; gercek PostgreSQL ile)
        run: tests/install/test_pitr.sh
      - name: Sirlar dosyada ve anahtar halkasi (secrets-migrate, crypto-keys)
        run: tests/install/test_secrets.sh
      - name: Veritabani rolleri (uretilen GRANT listesi koda uygun)
        run: python3 tests/support/test_db_roles.py
      - name: Bakim calistiricisi (izinli komutlar, PITR durum ozeti)
        run: python3 tests/support/test_ops_runner.py
      - name: SQL semasi (bos Postgres'e uygulanir)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=hr360admin -e POSTGRES_DB=hr360_operational postgres:18-alpine
          for _ in $(seq 1 30); do docker exec pg pg_isready -U hr360admin && break; sleep 2; done
          docker exec -i pg psql -U hr360admin -d hr360_operational -v ON_ERROR_STOP=1 -q < data/migrations/sql-all-schemas.sql
          docker exec pg psql -U hr360admin -d hr360_operational -Atc "select count(*) from information_schema.tables where table_schema='public'"
          # Temel sema gocleri icermeli: uzerine scripts/sql uygulaninca hicbir tablo/kolon eklenmemeli
          # (eklenirse yeni kurulumda eksik kalir; goc data/migrations/sql-all-schemas.sql sonuna eklenmeli).
          q="select table_name||'.'||column_name from information_schema.columns where table_schema='public' order by 1"
          docker exec pg psql -U hr360admin -d hr360_operational -Atc "$q" > /tmp/cols-base
          for f in scripts/sql/*.sql; do docker exec -i pg psql -U hr360admin -d hr360_operational -v ON_ERROR_STOP=1 -q < "$f" >/dev/null; done
          docker exec pg psql -U hr360admin -d hr360_operational -Atc "$q" > /tmp/cols-mig
          if ! diff /tmp/cols-base /tmp/cols-mig; then echo "::error::Temel semada eksik goc var (yukaridaki tablo/kolonlar)"; exit 1; fi

  security:
    name: Guvenlik taramasi
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
    steps:
      - uses: actions/checkout@v7
      - name: Trivy — bagimliliklar, gizli anahtarlar, Dockerfile/compose
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners vuln,secret,misconfig --ignorefile /src/.trivyignore.yaml --file-patterns 'pip:requirements-.*\.txt' \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /src/apps/web/node_modules /src
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (uretim bagimliliklari)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: NuGet — bilinen acigi olan paketler
        run: |
          rc=0
          for p in apps/services/*/; do
            out=$(cd "$p" && dotnet list package --vulnerable --include-transitive 2>&1)
            if echo "$out" | grep -q "has the following vulnerable packages"; then echo "$out"; rc=1; fi
          done
          exit $rc

  images:
    name: Docker imajlari
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, dotnet, dotnet-tests, ml, deploy-config, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # ghcr.io/<depo>/<servis>
      id-token: write   # cosign anahtarsiz imza: GitHub Actions OIDC kimligi (saklanacak anahtar yok)
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:sha-${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        # name = docker-compose.yml'deki servis adi (imaj adi da odur).
        include:
          - { name: web, context: apps/web }
          - { name: ml-inference, context: apps/ml-inference }
          - { name: mlflow, context: apps/ml-platform }
          - { name: mailer, context: deploy/mailer }
          - { name: compensation-service, context: apps/services/compensation-service }
          - { name: employee-service, context: apps/services/employee-service }
          - { name: engagement-service, context: apps/services/engagement-service }
          - { name: expense-service, context: apps/services/expense-service }
          - { name: governance-service, context: apps/services/governance-service }
          - { name: learning-service, context: apps/services/learning-service }
          - { name: leave-service, context: apps/services/leave-service }
          - { name: notification-service, context: apps/services/notification-service }
          - { name: onboarding-service, context: apps/services/onboarding-service }
          - { name: organization-service, context: apps/services/organization-service }
          - { name: performance-service, context: apps/services/performance-service }
          - { name: recruitment-service, context: apps/services/recruitment-service }
          - { name: tenant-service, context: apps/services/tenant-service }
          - { name: timeshift-service, context: apps/services/timeshift-service }
          - { name: workflow-service, context: apps/services/workflow-service }
    steps:
      - uses: actions/checkout@v7
      # Arayuz hesap menusunde surumu gosterir (web imajinin derleme argumani; digerleri yok sayar).
      - name: Surum
        run: echo "HR360_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: |
            hr360-${{ matrix.name }}:ci
            ${{ env.IMAGE }}
          build-args: HR360_VERSION=${{ env.HR360_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.HR360_VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy — imaj (duzeltmesi yayimlanmis kritik aciklar)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 hr360-${{ matrix.name }}:ci
      # Imajlar herkese acik yayinlanir: icinde sir (anahtar, parola, .env) olmamali. Sirlar kurulumda sunucuda uretilir.
      - name: Trivy — imajda sir yok
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b \
            image --scanners secret --exit-code 1 hr360-${{ matrix.name }}:ci
      # Guvenlik dalgasi 1: her imajin yazilim bilesen listesi (SBOM, CycloneDX). Yeni bir acik
      # duyuruldugunda hangi imajin etkilendigi bu listeden bulunur; 90 gun saklanir.
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b \
            image --format cyclonedx --output /out/hr360-${{ matrix.name }}.cdx.json hr360-${{ matrix.name }}:ci
          test -s sbom/hr360-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/hr360-${{ matrix.name }}.cdx.json
          retention-days: 90
      # Yayin: yalnizca taramalardan gecen imaj. Imza ve SBOM ozete (digest) baglanir; etiket tasinsa da gecerlidir.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Yayinla, imzala, SBOM tasdiki
        run: |
          docker push -q "$IMAGE"
          ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" | grep -m1 "^${IMAGE%:*}@sha256:")"
          test -n "$ref"
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate sbom/hr360-${{ matrix.name }}.cdx.json "$ref"
          # Sunucunun yaptigi dogrulamanin aynisi (scripts/lib/images.sh).
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" "$ref" >/dev/null
          echo "Yayinlandi: $ref" >> "$GITHUB_STEP_SUMMARY"
