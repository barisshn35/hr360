# HR360 temiz kurulum + demo verisi (AGIR; haftalik ve elle).
#
# Neden ayri ve haftalik: tum yigin (15 .NET servisi, Keycloak, Kafka, PostgreSQL, Redis, MinIO,
# ML, arayuz) GitHub'in standart calistiricisinda (4 cekirdek, 16 GB) sifirdan derlenip acilir;
# imaj derlemesi + ilk acilis 30-60 dk surer ve ~15 GB disk ister. Her push'ta calistirmak CI'yi
# kilitler. Hizli denetimler (bos Postgres'e sema, kurulum betigi sahte docker ile) ci.yml'de kalir.
#
# Ne dogrular (ci.yml'in yakalayamadiklari):
#   1. install.sh --demo --yes soru sormadan bastan sona calisir (sirlar uretilir, realm doldurulur,
#      sql-all-schemas.sql bos veritabanina init betigi olarak uygulanir, tum servisler acilir).
#   2. tenant-service ilk acilista "demo" sirketini olusturur; gateway + Keycloak + servisler konusur.
#   3. tests/support/seed_demo.py urunun kendi API'leriyle demo verisini kurar ve IKINCI kez
#      calistirildiginda hicbir sey olusturmaz (tekrar calistirilabilirlik) ve ayni kimlikleri doner.
#   4. tests/support/fresh_install_check.py: dort kullanici giris yapar, temel ekran verileri okunur.
#   5. Servis gunluklerinde beklenmeyen hata yok (scripts/test.sh logs; izin listesi tests/support/log-allowlist.txt).
# Integration/e2e testleri burada calismaz: sabit demo kimliklerine (tests/integration/common.py)
# baglidirlar ve temiz kurulumda kimlikler farklidir.
#
# Sirlar: calistiricida rastgele uretilir, is bitince calistiriciyla birlikte yok olur; .env ve
# tests/credentials.json yaziya dokulmez ve yapit olarak yuklenmez. Dis entegrasyon yok (SMTP = mailpit).
name: Temiz kurulum

on:
  schedule:
    - cron: "41 2 * * 0"   # her pazar 02:41 UTC
  workflow_dispatch:

concurrency:
  group: fresh-install
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-seed:
    name: install.sh + seed_demo.py (tam yigin)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HR360_BASE_URL: http://localhost
      # Test ortami: scripts/test.sh integration/e2e yalnizca HR360_TEST_ENV=1 ile calisir.
      HR360_TEST_ENV: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Disk alani ac (kullanilmayan SDK'lar)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: install.sh (soru sormadan, HTTP, mailpit, demo verisi)
        run: |
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo "T0=$start" >> "$GITHUB_ENV"
          ./install.sh --url http://localhost --tls none --smtp-host mailpit --no-smtp-test --demo --yes

      - name: Servislerin hazir olmasi (demo sirketi + gateway)
        run: |
          ok=0
          for _ in $(seq 1 120); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/governance/ethics/public/demo)" = 200 ]; then
              ok=$((ok + 1)); [ "$ok" -ge 3 ] && break
            else ok=0; fi
            sleep 5
          done
          docker compose ps --format '{{.Name}} {{.State}} {{.Health}}' | sort
          [ "$ok" -ge 3 ] || { echo "Uygulama 10 dk icinde hazir olmadi"; exit 1; }
          # Tek seferlik baslatma konteynerleri (exited 0) normaldir; hata koduyla cikan, yeniden
          # baslayan ya da saglik denetimi basarisiz olan konteyner kurulumu basarisiz sayar.
          bad=$(docker compose ps -a --format '{{.Name}} {{.State}} {{.ExitCode}} {{.Health}}' \
            | awk '($2 == "exited" && $3 != 0) || $2 == "restarting" || $2 == "dead" || $4 == "unhealthy"')
          [ -z "$bad" ] || { echo "Sagliksiz konteyner:"; echo "$bad"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Playwright (seed_demo jetonlari tarayici girisiyle alir)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: seed_demo.py (ilk calistirma)
        run: python tests/support/seed_demo.py | tee /tmp/seed1.log

      - name: seed_demo.py (ikinci calistirma — hicbir sey olusturmamali)
        run: |
          python tests/support/seed_demo.py | tee /tmp/seed2.log
          # Ilk calistirma olusturdugu her seyi bir satirla yazar; ikincide yalnizca son satir
          # (kimlik ozeti JSON) kalmali.
          if [ "$(sed '$d' /tmp/seed2.log | grep -c .)" != 0 ]; then
            echo "Ikinci calistirmada degisiklik yapildi (tekrar calistirilabilirlik bozuk):"; sed '$d' /tmp/seed2.log; exit 1
          fi
          [ "$(tail -1 /tmp/seed1.log)" = "$(tail -1 /tmp/seed2.log)" ] || { echo "Kimlikler iki calistirmada farkli"; exit 1; }

      - name: Duman denetimi (yalnizca okuma)
        run: python tests/support/fresh_install_check.py

      - name: Servis gunluklerinde hata taramasi
        run: scripts/test.sh logs "$T0"

      - name: Basarisizlikta konteyner durumu ve son gunlukler
        if: failure()
        run: |
          docker compose ps -a
          for s in $(docker compose ps -a --services); do
            echo "::group::$s"; docker compose logs --no-color --tail 80 "$s" 2>&1 | grep -viE 'password|secret|token' || true; echo "::endgroup::"
          done
