# HR360 frontend — statik SPA sunucusu.
# API gateway (app-01/02:80) bu container'a /  altında proxy yapar.
# Paylasim onizlemesi (index.html'deki __HR360_ORIGIN__): gateway'in ilettigi sema + Host.
map $http_x_forwarded_proto $hr360_origin_proto {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Container health check
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # İçerik hash'li varlıklar sonsuza kadar önbelleklenebilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html asla önbelleklenmez — yeni deploy anında görünür
    location = /index.html {
        sub_filter '__HR360_ORIGIN__' '$hr360_origin_proto://$host';
        sub_filter_once off;
        add_header Cache-Control "no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # PWA: servis çalışanı her zaman taze alınmalı (yeni sürüm hemen devreye girsin).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Yeni sürüm denetimi (açık sekmeler bu dosyayı yoklar): her zaman taze.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routing fallback (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
