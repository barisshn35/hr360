# Uygulama (SPA) yanitlarinin guvenlik basliklari. nginx'te bir location kendi
# add_header'ini tanimlarsa ust duzeydekiler miras alinmaz; bu yuzden her location'a
# include edilir.
#
# CSP: betik ve stil yalnizca ayni kokenden. 'unsafe-inline' yalnizca STIL icin
# (React style={...} nitelikleri ve animasyonlar); satir ici BETIK yoktur
# (tema betigi /theme-init.js). Keycloak (/auth) ve Grafana (/grafana) bu
# kapsayicidan sunulmaz; kendi basliklarini gonderirler.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
