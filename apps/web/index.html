    <title>HR360</title>
    <!-- JS yuklenmeden once gorunen acilis ekrani (CSP: stil satir ici serbest, betik yok). -->
    <style>
      #hr-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:hsl(0 0% 99%);color:hsl(240 4% 40%);font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;transition:opacity .45s ease,visibility .45s ease}
      .dark #hr-splash{background:hsl(240 8% 3.5%);color:hsl(240 5% 64%)}
      #hr-splash.hr-splash-out{opacity:0;visibility:hidden}
      .hr-sp-stage{position:relative;width:224px;height:224px;display:flex;align-items:center;justify-content:center}
      .hr-sp-glow{position:absolute;width:96px;height:96px;border-radius:50%;background:hsl(158 80% 41%/.22);filter:blur(28px);animation:hr-sp-pulse 2.4s ease-in-out infinite}
      .hr-sp-mark{position:relative;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,hsl(158 80% 41%),hsl(170 80% 32%));box-shadow:0 0 40px -6px hsl(158 80% 41%);animation:hr-sp-in .6s cubic-bezier(.2,.8,.2,1) both}
      .hr-sp-mark img{width:32px;height:32px}
      .hr-sp-ring{position:absolute;inset:0;margin:auto;border-radius:50%;border:1px dashed hsl(240 5% 50%/.18)}
      .hr-sp-r1{width:124px;height:124px}.hr-sp-r2{width:196px;height:196px}
      .hr-sp-orbit{position:absolute;inset:0;margin:auto;border-radius:50%;animation:hr-sp-spin 8s linear infinite}
      .hr-sp-orbit.o2{width:196px;height:196px;animation-duration:14s;animation-direction:reverse}
      .hr-sp-orbit.o1{width:124px;height:124px}
      .hr-sp-dot{position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:hsl(158 80% 41%);box-shadow:0 0 12px hsl(158 80% 41%)}
      .o2 .hr-sp-dot{width:8px;height:8px;top:-4px;margin-left:-4px;background:hsl(170 85% 60%);box-shadow:none}
      .hr-sp-label{animation:hr-sp-fade .5s .2s ease both}
      .hr-sp-label span{animation:hr-sp-blink 1s steps(1) infinite}
      @keyframes hr-sp-spin{to{transform:rotate(360deg)}}
      @keyframes hr-sp-pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
      @keyframes hr-sp-in{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
      @keyframes hr-sp-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @keyframes hr-sp-blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){#hr-splash *{animation:none!important}#hr-splash{transition:none}}
    </style>
  </head>
  <body>
    <noscript>HR360 için JavaScript gereklidir. / HR360 requires JavaScript.</noscript>
    <div id="root"></div>
    <div id="hr-splash" role="status" aria-live="polite">
      <div class="hr-sp-stage" aria-hidden="true">
        <span class="hr-sp-ring hr-sp-r1"></span>
        <span class="hr-sp-ring hr-sp-r2"></span>
        <span class="hr-sp-glow"></span>
        <span class="hr-sp-orbit o1"><i class="hr-sp-dot"></i></span>
        <span class="hr-sp-orbit o2"><i class="hr-sp-dot"></i></span>
        <span class="hr-sp-mark"><img src="/icon-white.svg" alt="" /></span>
      </div>
      <p class="hr-sp-label">HR360<span>_</span></p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
